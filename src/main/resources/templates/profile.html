<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoDoar | Perfil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <nav class="navbar">
        <a class="brand" th:href="@{/}">EcoDoar</a>
        <div class="nav-links">
            <a th:href="@{/beneficiaries}">Beneficiários</a>
            <a th:href="@{/validation}">Validação</a>
            <a th:href="@{/history}">Histórico</a>
            <a th:href="@{/logs}">Logs</a>
            <a th:href="@{/tests}">Testes</a>
            <a class="active" th:href="@{/profile}" th:text="${currentUser.displayName}">Perfil</a>
            <a th:href="@{/logout}">Sair</a>
        </div>
    </nav>
</header>

<main class="container narrow">
    <section class="card">
        <span class="eyebrow">UC05 — Edit Profile</span>
        <h1>Perfil</h1>
        <p>Área demonstrativa para visualizar a sessão autenticada.</p>
        <dl class="profile-list">
            <dt>Nome</dt>
            <dd th:text="${currentUser.displayName}">Admin Cruz Vermelha</dd>
            <dt>Email</dt>
            <dd th:text="${currentUser.email}">admin@ecodoar.pt</dd>
            <dt>Role</dt>
            <dd th:text="${currentUser.role}">RED_CROSS_ADMIN</dd>
        </dl>
    </section>
</main>
</body>
</html>
