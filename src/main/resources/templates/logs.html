<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoDoar | Logs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <nav class="navbar">
        <a class="brand" th:href="@{/}">EcoDoar</a>
        <div class="nav-links">
            <a th:href="@{/beneficiaries}">Beneficiários</a>
            <a th:href="@{/validation}">Validação</a>
            <a th:href="@{/history}">Histórico</a>
            <a class="active" th:href="@{/logs}">Logs</a>
            <a th:href="@{/tests}">Testes</a>
        </div>
    </nav>
</header>

<main class="container">
    <section class="card">
        <span class="eyebrow">REQ-018</span>
        <h1>Logs de auditoria</h1>
        <p>Eventos de validação registados durante a execução atual da aplicação.</p>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>timestamp</th>
                    <th>action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#dates.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-06-01 10:00:00</td>
                    <td th:text="${log.action}">Validation success</td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="2" class="empty-state">Ainda não existem logs nesta execução.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
